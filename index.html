<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide to Mastering Excel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#16203a;--mute:#5d6578;--line:#ddd9cf;--red:#d6001c;--redsoft:#fde8ea;--navy:#16203a;--navyink:#e9ecf4;--grn:#1d7a47;--grnsoft:#e3f3ea;--tgt:#fff4c2;--code:#0d1117;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f131c;--card:#192032;--ink:#ecebe5;--mute:#9ba3b6;--line:#2b344a;--redsoft:#3b1a21;--navy:#0a0e17;--grnsoft:#143323;--tgt:#4a4310;--red:#ff4a5e}}
:root[data-theme="dark"]{--bg:#0f131c;--card:#192032;--ink:#ecebe5;--mute:#9ba3b6;--line:#2b344a;--redsoft:#3b1a21;--navy:#0a0e17;--grnsoft:#143323;--tgt:#4a4310;--red:#ff4a5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Be Vietnam Pro",system-ui,"Segoe UI",Arial,sans-serif}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{background:var(--navy);color:var(--navyink);padding:24px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;align-self:start}
aside h1{font-size:22px;line-height:1.25;margin:0 0 6px;font-weight:800}
aside p{margin:0 0 16px;font-size:13px;opacity:.7}
.ov{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:18px}
.track{flex:1;height:8px;background:#ffffff26;border-radius:4px;overflow:hidden}.fill{height:100%;width:0;background:var(--red);transition:width .3s}
.day{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:inherit;font:500 14px/1.3 inherit;font-family:inherit;border-radius:10px;padding:10px;margin-bottom:4px;cursor:pointer}
.day:hover{background:#ffffff12}.day[aria-selected="true"]{background:#ffffff1c;border-color:#ffffff33}
.dn{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#ffffff1f}
.day.done .dn{background:var(--grn);color:#fff}
.day small{display:block;opacity:.6;font-size:12px;font-weight:400}
.mob{display:none}
main{padding:0 0 60px;min-width:0}
.hero{background:linear-gradient(120deg,var(--navy) 55%,#8c0014);color:#fff;padding:44px clamp(20px,4vw,56px) 36px}
.hero .big{font-size:clamp(34px,6vw,64px);font-weight:800;line-height:1.05;margin:0}
.hero p{max-width:60ch;margin:10px 0 0;opacity:.85;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.chip{font-size:13px;border:1px solid #ffffff55;border-radius:20px;padding:2px 12px}
.body{padding:0 clamp(20px,4vw,56px);max-width:none}
h2{font-size:22px;margin:36px 0 12px}
.why{background:var(--redsoft);border-left:5px solid var(--red);border-radius:8px;padding:12px 16px;margin-top:24px}
.step{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;transition:opacity .2s}
.step input{width:22px;height:22px;margin-top:3px;accent-color:var(--grn);flex:0 0 auto}.step.on{opacity:.6}.step.on .st{text-decoration:line-through}
.st{font-weight:700;cursor:pointer}.sd{margin:2px 0 0;color:var(--mute);font-size:15px}
.code{background:var(--code);color:#f4f1e8;border-radius:8px;padding:8px 10px;margin-top:8px;display:flex;gap:10px;align-items:center}
.code code{font:500 14px/1.5 ui-monospace,Consolas,monospace;overflow-x:auto;white-space:pre;flex:1}
.cp{border:1px solid #667;background:transparent;color:#f4f1e8;border-radius:6px;padding:4px 10px;font:500 13px inherit;font-family:inherit;cursor:pointer}
.lab{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lab-h{background:var(--grn);color:#fff;padding:10px 16px;font-weight:700}
.lab-b{padding:14px 16px}.lab-b p{margin:0 0 10px}
.sheet{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;font-size:14px;width:100%;min-width:760px}
th{background:var(--grnsoft);color:var(--grn);font-weight:700;border:1px solid var(--line);padding:4px;text-align:center}
td{border:1px solid var(--line);padding:0}th.r{width:34px}
td input{width:100%;min-width:64px;border:0;background:transparent;color:inherit;font:inherit;font-size:14px;padding:6px 8px;height:34px}
td.tgt{background:var(--tgt)}td.ok{background:var(--grnsoft)}td.bad{background:var(--redsoft)}
td input:focus{outline:2px solid var(--grn);outline-offset:-2px}
.bt{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{border:0;background:var(--red);color:#fff;border-radius:8px;padding:10px 18px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn[disabled]{opacity:.35;cursor:default}
#res{font-weight:700}#res.g{color:var(--grn)}#res.b{color:var(--red)}
.ex{background:var(--card);border:1px dashed var(--red);border-radius:12px;padding:6px 16px 6px 34px}.ex li{margin:8px 0}
.nav{display:flex;justify-content:space-between;margin-top:30px}
.note{color:var(--mute);font-size:13px;margin-top:30px}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
@media (max-width:820px){.app{display:block}aside{display:none}.mob{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}.mob button{flex:0 0 auto;border:1px solid #ffffff44;background:transparent;color:#fff;border-radius:8px;padding:6px 12px;font:500 13px inherit;font-family:inherit}.mob button[aria-selected="true"]{background:var(--red);border-color:var(--red)}}
.nx{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid #ffffff22;color:inherit;font:700 14px inherit;font-family:inherit;padding:12px 10px;margin-top:6px;cursor:pointer;border-radius:8px}
.nx[aria-selected="true"],.nx:hover{background:#ffffff1c}.nx small{display:block;font-weight:400;opacity:.6}
.tl{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 14px;font:500 14px inherit;font-family:inherit;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}.pill.dn2{border-color:var(--grn)}
#q{width:100%;max-width:420px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.fc h3{margin:0 0 6px;font-size:17px}.fc p{margin:6px 0;font-size:14px;color:var(--mute)}
.tag{font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px;margin-left:6px;background:var(--grnsoft);color:var(--grn);vertical-align:middle}
.tag.m{background:var(--redsoft);color:var(--red)}.tag.r{background:var(--tgt);color:var(--ink)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}.ctl label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
.ctl select,.ctl input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;min-width:130px}
.hl-red{background:#ffb3bb!important;color:#5c0010}.hl-yel{background:#ffe680!important;color:#4a3b00}.hl-grn{background:#a8e6c1!important;color:#064d28}
.dt td{padding:5px 10px;white-space:nowrap}.dt th{padding:4px 10px}.dt .tot{font-weight:700;background:var(--grnsoft)}
.apl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.apl span{background:var(--grnsoft);color:var(--grn);border-radius:6px;padding:3px 4px 3px 10px;font-size:13px;font-weight:600}.apl button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:14px}
.tk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px dashed var(--red);border-radius:10px;padding:10px 14px;margin-bottom:8px}.tk b{flex:1;min-width:200px;font-weight:600}.tk i{font-style:normal;font-weight:700}
.btn.sm{padding:6px 14px;font-size:14px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:32px;align-items:start}.colr{position:sticky;top:12px}
@media (max-width:1150px){.cols{display:block}.colr{position:static}}
details.fc summary{list-style:revert}details.fc ul,details.fc ol{margin:4px 0;padding-left:22px;font-size:14px;color:var(--ink)}
code{font-family:ui-monospace,Consolas,monospace;font-weight:600;background:none;padding:0;border-radius:0}
</style></head><body>
<div class="app">
<aside><h1>Guide to Mastering Excel</h1>
<div class="ov"><span id="pt">0%</span><div class="track"><div class="fill" id="pf"></div></div></div>
<nav id="days"></nav></aside>
<div><div class="mob" id="mob"></div><main id="main"></main></div>
</div>
<script>
var D=[
{t:"Làm sạch dữ liệu",s:"Mã sạch, không trùng, không mất số",g:"Có danh sách mã vận đơn sạch để mọi công thức sau này chạy đúng.",m:["30 phút","Filter, TRIM, Remove Duplicates"],
why:"Mã thừa khoảng trắng hoặc bị đổi thành 8.8E+11 là nguyên nhân số 1 gây lỗi #N/A ở bài đối chiếu.",
steps:[
["Đặt cột mã về dạng Text","Bôi đen cột A, chuột phải, Format Cells, chọn Text, OK. Làm trước khi dán mã vào."],
["Xóa khoảng trắng thừa","Ở ô D2 gõ công thức bên dưới, kéo xuống hết dòng. Copy cột D, dán đè lên cột A bằng Paste Special, Values, rồi xóa cột D.","=TRIM(A2)"],
["Xóa mã trùng","Lưu bản sao file trước. Bôi đen bảng, tab Data, Remove Duplicates, chỉ tick cột A, OK. Ghi lại số dòng đã xóa."],
["Lọc và sắp xếp","Bấm Ctrl+Shift+L để bật Filter. Lọc cột Trạng thái = Khiếu nại, sắp cột cân từ lớn đến nhỏ."],
["Cố định dòng tiêu đề","Tab View, Freeze Panes, Freeze Top Row."]],
tb:[["Mã vận đơn","Cân (kg)","Trạng thái"],["880000000001","1.2","Lệch cân"],["880000000002 ␣","0.5","Bình thường"],["880000000001","1.2","Lệch cân"]],
ex:["Gõ lại bảng mẫu (cột A để Text trước), cố ý thêm 1 dấu cách sau mã thứ hai.","Làm sạch bằng TRIM rồi Paste Values.","Remove Duplicates: Excel xóa mấy dòng?","Lọc đơn Khiếu nại và sắp theo cân.","Thử gõ mã 12 số vào ô General và ô Text, so sánh kết quả."]},
{t:"Tính cân quy đổi",s:"Cân thực tế so với cân thể tích",g:"Tính tự động cân quy đổi và cân tính cước cho hàng nghìn đơn bằng 1 công thức.",m:["35 phút","Nhân chia, MAX, ROUNDUP"],
why:"Cân tính cước thường là số lớn hơn giữa cân thực tế và cân quy đổi. Đây là phần giải thích cho khách nhiều nhất.",
steps:[
["Dựng bảng","Cột A mã, B cân thực tế (kg), C dài, D rộng, E cao (cm). Ô J1 là hệ số chia, nhập số theo quy định mới nhất [ ]. Không gõ cứng số vào công thức."],
["Tính cân quy đổi","Ở F2, kéo xuống hết dòng. Dấu $ giữ nguyên ô hệ số khi kéo.","=C2*D2*E2/$J$1"],
["Tính cân tính cước","Ở G2: lấy số lớn hơn giữa cân thực tế và cân quy đổi.","=MAX(B2,F2)"],
["Làm tròn theo quy định","Nếu J&T làm tròn lên theo bước nhất định, dùng công thức dưới (ví dụ bước 0.5 kg, thay theo quy định thật [ ]).","=CEILING(MAX(B2,F2),0.5)"],
["Đánh dấu đơn tính theo thể tích","Ở H2, để nhìn nhanh đơn nào bị tính theo cân quy đổi.","=IF(F2>B2,\"Theo thể tích\",\"Theo thực tế\")"]],
tb:[["B (kg)","C","D","E","J1","F (quy đổi)","G (tính cước)"],["1.2","40","30","25","[hệ số]","=C2*D2*E2/J1","=MAX(B2,F2)"]],
ex:["Nhập 3 đơn: 1 đơn nhẹ cồng kềnh, 1 đơn nặng nhỏ gọn, 1 đơn gần bằng nhau.","Kiểm tra bằng máy tính tay 1 đơn xem công thức có khớp.","Đổi ô J1 và quan sát cả cột tự cập nhật."]},
{t:"Tìm đơn lệch cân",s:"Tự động báo và bôi màu đơn lệch",g:"Chỉ nhìn 1 cột là biết đơn nào lệch và lệch bao nhiêu.",m:["35 phút","IF, ABS, Conditional Formatting"],
why:"Thay vì dò từng dòng, để Excel so cân khách khai với cân kho đo và tô đỏ đơn vượt ngưỡng.",
steps:[
["Dựng bảng","Cột A mã, B cân khách khai, C cân kho đo. Ô J1 là ngưỡng chênh lệch cho phép [ ]."],
["Tính chênh lệch","Ở D2, kéo xuống. Kết quả dương nghĩa là kho đo nặng hơn khách khai.","=ROUND(C2-B2,2)"],
["Gắn nhãn lệch cân","Ở E2. ABS lấy giá trị tuyệt đối để lệch lên hay xuống đều được tính.","=IF(ABS(D2)>$J$1,\"Lệch cân\",\"OK\")"],
["Kết hợp nhiều điều kiện","Chỉ báo khi lệch quá ngưỡng và cân kho lớn hơn mức tối thiểu ở J2.","=IF(AND(ABS(D2)>$J$1,C2>=$J$2),\"Lệch cân\",\"OK\")"],
["Tô màu tự động","Bôi đen A2:E1000, Home, Conditional Formatting, New Rule, Use a formula, gõ công thức bên dưới, chọn màu đỏ nhạt.","=$E2=\"Lệch cân\""]],
tb:[["A","B (khách khai)","C (kho đo)","D (chênh)","E (kết quả)"],["880001","1.0","1.6","0.6","Lệch cân"],["880002","2.0","2.0","0","OK"]],
ex:["Nhập 5 đơn, trong đó 2 đơn lệch trên ngưỡng.","Đổi ngưỡng J1 và xem số đơn lệch thay đổi.","Dùng Filter cột E chỉ giữ đơn Lệch cân."]},
{t:"Đối chiếu mã vận đơn",s:"So 2 file, tìm đơn thiếu và trùng",g:"Biết ngay đơn nào có ở file này mà thiếu ở file kia, không dò bằng mắt.",m:["45 phút","VLOOKUP, XLOOKUP, COUNTIF, IFERROR"],
why:"Đây là kỹ năng giá trị nhất của cả tuần. Nếu bị #N/A, quay lại Ngày 1 (khoảng trắng, định dạng Text).",
steps:[
["Chuẩn bị 2 sheet","Sheet Kho: cột A mã, B cân kho đo. Sheet Khach: cột A mã, B cân khách khai. Cả 2 cột mã đều đã làm sạch."],
["Kéo cân khách sang sheet Kho","Ở C2 của sheet Kho. FALSE nghĩa là tìm khớp chính xác. IFERROR hiện chữ thay cho lỗi.","=IFERROR(VLOOKUP(A2,Khach!A:B,2,FALSE),\"Không có\")"],
["Cách mới hơn nếu máy có XLOOKUP","Ngắn hơn và không cần đếm số cột.","=XLOOKUP(A2,Khach!A:A,Khach!B:B,\"Không có\")"],
["Tìm mã trùng","Ở D2, ra TRUE nghĩa là mã đó xuất hiện nhiều hơn 1 lần.","=COUNTIF(A:A,A2)>1"],
["Lọc đơn thiếu","Bật Filter, lọc cột C = Không có để ra danh sách đơn chỉ có ở 1 bên."]],
tb:[["Mã (Kho)","Cân kho","Cân khách (kéo sang)"],["880001","1.6","1.0"],["880003","0.8","Không có"]],
ex:["Tạo 2 sheet nhỏ, mỗi sheet 10 mã, cố ý bỏ sót 2 mã.","Dùng VLOOKUP tìm 2 mã thiếu.","Thêm 1 mã trùng và dùng COUNTIF tìm ra."]},
{t:"Lọc và thống kê khiếu nại",s:"Đếm và cộng theo điều kiện",g:"Trả lời nhanh: hôm nay bao nhiêu khiếu nại, loại nào nhiều, tổng cước chênh bao nhiêu.",m:["40 phút","COUNTIFS, SUMIFS, Filter"],
why:"Hai hàm này thay cho việc lọc rồi đếm tay mỗi ngày.",
steps:[
["Dựng bảng","Cột A mã, B ngày, C loại khiếu nại, D trạng thái xử lý, E cước chênh lệch (đồng)."],
["Đếm theo 1 điều kiện","Số khiếu nại loại Lệch cân.","=COUNTIF(C:C,\"Lệch cân\")"],
["Đếm theo nhiều điều kiện","Số khiếu nại Lệch cân còn đang Chờ xử lý. Thêm điều kiện nào thì thêm cặp vùng, giá trị.","=COUNTIFS(C:C,\"Lệch cân\",D:D,\"Chờ xử lý\")"],
["Cộng cước theo điều kiện","Tổng cước chênh lệch của khiếu nại Lệch cân.","=SUMIFS(E:E,C:C,\"Lệch cân\")"],
["Theo ngày","Số khiếu nại của ngày nhập ở ô H1.","=COUNTIFS(B:B,$H$1)"],
["Lọc để xem chi tiết","Bật Filter, tick nhiều giá trị trong cùng cột, hoặc lọc ở 2 cột liên tiếp."]],
tb:[["Mã","Ngày","Loại","Trạng thái","Cước chênh"],["880001","01/06","Lệch cân","Chờ xử lý","12000"],["880002","01/06","Cước phát sinh","Đã xử lý","8000"]],
ex:["Nhập 10 dòng khiếu nại giả.","Đếm số đơn Chờ xử lý theo từng loại.","Tính tổng cước chênh của đơn Đã xử lý."]},
{t:"Báo cáo cuối ngày",s:"Pivot Table trong vài cú click",g:"Làm báo cáo tổng hợp xong trong 2 phút, không cần viết công thức.",m:["40 phút","Pivot Table"],
why:"Pivot Table tự gom và đếm theo nhóm, rất hợp báo cáo ca, báo cáo ngày.",
steps:[
["Chuẩn bị","Bảng phải có tiêu đề mỗi cột, không có dòng hay cột trống ở giữa."],
["Tạo Pivot","Bấm 1 ô trong bảng, tab Insert, PivotTable, OK."],
["Kéo thả trường","Kéo Loại khiếu nại vào Rows, Mã vận đơn vào Values (chọn Count), Trạng thái vào Columns."],
["Thêm tổng cước","Kéo Cước chênh lệch vào Values, đổi sang Sum nếu Excel chọn Count."],
["Lọc theo ngày","Kéo Ngày vào Filters, chọn ngày cần báo cáo."],
["Cập nhật khi có dữ liệu mới","Chuột phải vào Pivot, chọn Refresh."]],
tb:[["Loại","Chờ xử lý","Đã xử lý","Tổng"],["Lệch cân","5","12","17"],["Cước phát sinh","2","6","8"]],
